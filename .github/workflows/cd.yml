name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check ./
        continue-on-error: true

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Verify deployment branch
      run: |
        git fetch --all
        if ! git rev-parse --verify deploy; then
          git checkout -b deploy
        else
          git checkout deploy
        fi

    - name: Build application
      run: npm run build --production

    - name: Cleanup 
      run: |
        git rm -r .
        mv build/* .
    
    - name: Commit to deployment branch
      run: |
        git add .
        git commit -m "Deploy build files"
        git push origin deploy
